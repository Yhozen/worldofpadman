name: Web preview

on:
  pull_request:
    paths:
      - 'web/**'
      - 'code/**'
      - 'libs/**'
      - 'wop/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'code/**'
      - 'libs/**'
      - 'wop/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.10'
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm check && pnpm test
        working-directory: web
      - name: Browser smoke test
        working-directory: web
        run: |
          node scripts/serve.mjs > "$RUNNER_TEMP/wop-web-server.log" 2>&1 &
          wop_server_pid=$!
          trap 'kill "$wop_server_pid"' EXIT
          curl --silent --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8440/ > /dev/null
          pnpm test:browser
